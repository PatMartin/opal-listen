# Managed by `opal listen reaction` — edits are safe but comments are not preserved.
# Reactions fire only on live-mic matches while `reactions_enabled` is true:
#   opal listen config setting set --name reactions_enabled --value true
# Schema: docs/USER_GUIDE.md section 4.5 (intent reactions).
reactions:
- name: bashtop_start
  enabled: true
  conditions:
  - path: intent_name
    operator: eq
    value: bashtop_start
  actions:
  - type: command
    argv:
    - systemd-run
    - --user
    - --collect
    - --unit=opal-bashtop
    - --setenv=DISPLAY
    - --setenv=XAUTHORITY
    - xterm
    - -e
    - bashtop
    timeout_s: 15.0
- name: bashtop_stop
  enabled: true
  conditions:
  - path: intent_name
    operator: eq
    value: bashtop_stop
  actions:
  - type: command
    argv:
    - systemctl
    - --user
    - stop
    - opal-bashtop
    timeout_s: 15.0
- name: hello_opal
  enabled: true
  conditions:
  - path: intent_name
    operator: eq
    value: hello_opal
  actions:
  - type: command
    argv:
    - bash
    - scripts/hello_opal.sh
    timeout_s: 15.0
    cwd: C:/gh/opal/opal-listen
