[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opal-listener"
version = "0.1.0"
description = "Local-first wakeword, STT, intent recognition and slot extraction engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "rapidfuzz>=3.6",
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
    "pyzmq>=26.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[project.scripts]
opal = "opal_listener.cli.main:app"
opal-listener-server = "opal_listener.__main__:main"

[project.entry-points."opal_listener.providers"]
vosk = "opal_listener.service.providers.vosk_provider:VoskListenerProvider"

[tool.setuptools.packages.find]
include = ["opal_listener*"]
exclude = ["opal_listener.tests*"]

[tool.setuptools.package-data]
opal_listener = [
    "config/*.yaml",
    "view/static/*.html",
    "data/migrations/*.py",
    "data/migrations/*.mako",
    "data/migrations/versions/*.py",
]

[tool.pytest.ini_options]
testpaths = ["opal_listener/tests"]
markers = [
    "vosk: requires the Vosk model on disk (skipped when unavailable)",
    "slow: slower audio pipeline tests",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
