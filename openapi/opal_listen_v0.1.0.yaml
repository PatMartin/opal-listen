tags:
- name: config
  description: Save, load, validate, and inspect portable module configuration.
- name: profiles
  description: 'Reusable namespaced configuration profiles; at most one is locally active.
    The active profile''s `shared` values and `modules.opal-listen` compartment supply
    recognition defaults.'
- name: failed_utterances
- name: health
- name: intents
- name: logs
- name: performance
- name: persona
- name: recognition
- name: regression
- name: slots
- name: wakewords
- name: service
servers:
- url: http://127.0.0.1:8000
x-opal-context-standard:
  version: '2.0.0'
  headers:
  - X-Opal-Session-Id
  - X-Opal-Transaction-Id
  - X-Opal-Request-Id
  - X-Opal-Causation-Id
  session_mode: context-only
  id_format: opaque-printable-ascii-1-to-128
  transaction_atomicity: false
  events:
    envelope:
      $ref: './shared/opal_kernel.yaml#/x-opal-event-envelope'
    metadata_schema_version: '2.0'
  pagination:
    history: none
    configuration: none
    default_limit: 100
    max_limit: 500
  concurrency:
    settings_and_config_mutations: strong-etag-if-match-required
    failed_utterances_review_state: runtime-history-data-if-match-exempt
    missing_status: 428
    stale_status: 412
  streaming: Include HTTP context headers before bytes; after headers are sent, failures
    are represented by transport-specific terminal events or stream termination; no
    invented resumability.
security:
- BearerAuth: []
x-opal-authorization: {$ref: './shared/opal_kernel.yaml#/x-opal-authorization'}
x-opal-profile-namespace:
  compartment: opal-listen
  schema: './shared/opal_kernel.yaml#/components/schemas/OpalListenProfileNamespace'
  patch_schema: './shared/opal_kernel.yaml#/components/schemas/OpalListenProfileNamespacePatch'
  description: >-
    Declares this module's compartment key in namespaced profiles and the
    schemas that validate it. Profile defaults migrated from the v2 flat
    fields wakeword_names, confidence_thresholds, vad_settings,
    enabled_intents, enabled_slots, model_paths; see
    docs/PROFILE_MIGRATION.md.
x-opal-health-details:
  version: '1.0'
  description: >-
    Module-defined members of OpalHealthReport.details. Listen reports its
    host audio input devices under `audio_devices` - the payload formerly
    served by the retired /api/v1/health/audio_devices route.
  members:
    audio_devices:
      type: array
      items:
        $ref: '#/components/schemas/AudioDevice'
x-opal-snapshot:
  version: '1.0'
  module: opal-listen
  format_versions:
  - '1.0.0'
  resources:
  - profiles
  - personas
  - wakewords
  - intents
  - slots
  - regression_tests
  description: >-
    Declares the canonical module identity and resource sections carried in this module's
    configuration snapshots. `config load`/`config validate` validate `snapshot` against the shared
    `OpalConfigSnapshot` envelope and the declared `module` identity and resource
    sections; wrong-module, unsupported-version, and unknown-section snapshots are
    rejected. Snapshots carry persistent desired configuration only:
    profiles, personas, wakewords, intents, slots, regression_tests; never runtime history, sessions, streams, binaries, or secrets.
