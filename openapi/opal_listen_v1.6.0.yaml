          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*
          description: Globally unique OPAL persona identifier.
          example: amy
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Human-readable persona name.
          example: Amy
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          description: Optional human-readable description or character notes.
        voice_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Optional OPAL Say voice identifier associated with this persona.
          example: en-gb-alan-low
        enabled:
          type: boolean
          default: true
          description: Whether this persona may be selected.
      example:
        persona_id: amy
        name: Amy
        voice_id: en-gb-alan-low
        enabled: true
