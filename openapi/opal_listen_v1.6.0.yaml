openapi: 3.1.0
info:
  title: Voice Intent API
  version: 1.6.0
  description: "Wakeword, STT, intent recognition, and slot extraction engine\n\n\
    OPAL SUITE STANDARD v1.2 (normative; follows the shared kernel version)\nX-Opal-Session-Id is an optional logical\
    \ context identifier; it does not create a server-managed session or grant authorization.\
    \ Entry-point services generate one when absent where a workflow requires it,\
    \ and propagate it unchanged. A preexisting service-local session resource has\
    \ a separate lifecycle. X-Opal-Transaction-Id is a single logical end-to-end operation\
    \ and is not an atomic distributed transaction. X-Opal-Request-Id identifies one\
    \ inbound HTTP exchange and is regenerated for each downstream HTTP hop (the incoming\
    \ one can be used for diagnostics); X-Opal-Causation-Id names the immediate parent\
    \ event/request, where applicable. For inbound requests, if a transaction ID is\
    \ absent the service assigns one; all response types (including errors, streamed\
    \ headers, and binary bodies) return session ID if known and transaction/request\
    \ IDs. Never trust these values for access control. Propagate them into derived\
    \ ZeroMQ envelope metadata. All identifiers are opaque 1..128-character printable\
    \ ASCII tokens with no control/whitespace characters; client-supplied invalid\
    \ values yield 422.\nStandard health routes: /api/v1/health/, /api/v1/health/live,\
    \ /api/v1/health/ready. Settings: GET and PATCH /api/v1/settings/ exclusively;\
    \ PATCH is atomic. Mutable configuration uses strong ETags and mandatory If-Match\
    \ with 428 missing, 412 stale. For bounded configuration catalogs return full\
    \ arrays (subject to explicit deployment caps); for growing histories use cursor\
    \ pagination with stable deterministic ordering, opaque next_cursor and has_more.\
    \ Cursors are scoped to the exact filter set and invalidate on mismatch (422);\
    \ cursor values expire explicitly. Standard HTTP creation 201 Location, async\
    \ admission 202, empty deletion 204. Streaming keeps media-specific transports\
    \ but exposes correlation headers, defined failure behavior, and no unsupported\
    \ replay guarantee. Configuration export/import/validation excludes secrets and\
    \ history.\n\n\n    OPAL LISTEN (normative additions)\n\n    Versioning:\
    \ this document's info.version is the authoritative REST contract version, independent\
    \ of the\n    Python package version and of the event-envelope metadata schema_version\
    \ (currently '2.0' \u2014 the\n    envelope emitted on opal.listen.intent.match). The OPAL suite standard follows the shared kernel version (currently v1.2).\n\
    \n    Event publication: external intent-match events are published only when\
    \ setting\n    event_publication_enabled is true (default false, live-toggleable\
    \ via PATCH /api/v1/settings/).\n    Recognition results from the diagnostic sources\
    \ (\"text\" via POST /api/v1/recognition/test_text and\n    \"audio\" via POST\
    \ /api/v1/recognition/test_audio) are always evaluated, logged and streamed locally\n\
    \    but never published externally; only live microphone (\"mic\") matches are\
    \ actionable. Duplicate live\n    matches inside dedup_window_ms are flagged deduplicated\
    \ and not republished. event_transport selects\n    'http' or 'zmq'; 'both' is\
    \ rejected (no cross-transport deduplication in OPAL Event).\n\n    Refinement:\
    \ optional second-pass STT refinement (stt_refiner) runs asynchronously on a bounded\n\
    \    worker queue and never blocks capture. On refiner error, refiner_timeout_ms\
    \ timeout or a full\n    queue the draft transcript is used and the result carries\
    \ refinement_error.\n\n    Metrics: GET /api/v1/recognition/status returns a metrics\
    \ object (reset per run) with\n    mic_overflows, dropped_audio_blocks, audio_queue_depth,\
    \ audio_queue_utilization, refine_queue_depth,\n    refinement_completed, refinement_failed,\
    \ recoveries and the last finalized result's\n    stt/refine/intent/publish latencies\
    \ (ms).\n\n    Intentional breaking changes since 1.2.0: event_transport='both'\
    \ is now a configuration error;\n    external intent-match publication is disabled\
    \ by default (event_publication_enabled); a pending\n    wakeword candidate no\
    \ longer produces a command outcome without confirmation.\n    "
